# One-command demo stack for Ragent.
#
#   docker compose up                                       # web + python-api (no vector store, no Postgres)
#   docker compose --profile qdrant up                      # also start Qdrant + flip retrieval backend
#   docker compose --profile postgres up                    # also start Postgres + persist BFF platform state there
#   docker compose --profile qdrant --profile postgres up   # full stack
#
# Host ports default to 3000 (web), 8000 (python-api),
# 6333/6334 (qdrant, only with --profile qdrant), and
# 5432 (postgres, only with --profile postgres).
#
# Configuration is read from `.env.docker` in this directory (which is
# gitignored). Start by copying `.env.docker.example` to `.env.docker`
# and editing it. The compose file injects a few service-to-service
# values (e.g. PYTHON_API_BASE_URL pointing at the python-api service
# hostname on the compose bridge network) that you should NOT have to
# touch.

name: ragent

services:
  python-api:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: ragent-python-api:dev
    container_name: ragent-python-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Service-to-service overrides. These are intentionally set here
      # (not in .env.docker) so the demo "just works" out of the box.
      PYTHON_HOST: "0.0.0.0"
      PYTHON_PORT: "8000"
      # Persist the sqlite-backed ingestion store inside the named
      # volume so restarts do not lose state.
      PYTHON_INGESTION_SQLITE_PATH: "/home/app/data/ingestion.db"
      # Point at the qdrant service if it's running. Has no effect when
      # PYTHON_RETRIEVAL_BACKEND is not "qdrant" / "hybrid", which is
      # the default for the no-profile launch.
      PYTHON_QDRANT_URL: "http://qdrant:6333"
    ports:
      - "${RAGENT_PYTHON_HOST_PORT:-8000}:8000"
    volumes:
      - python_data:/home/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ragent-web:dev
    container_name: ragent-web
    restart: unless-stopped
    depends_on:
      python-api:
        condition: service_healthy
      # `postgres` lives under the postgres profile. Compose silently
      # drops this dependency when the profile is not activated, so the
      # default `docker compose up` still works without Postgres.
      postgres:
        condition: service_healthy
        required: false
    env_file:
      - .env.docker
    environment:
      # Pin the BFF to the Python pipeline so the demo exercises the
      # full Python stack out of the box. Override in .env.docker if
      # you want the TS-only fallback path.
      RAG_BACKEND: "python"
      # Service-to-service: web → python-api over the compose bridge.
      PYTHON_API_BASE_URL: "http://python-api:8000"
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Default the Postgres connection string to the in-network
      # `postgres` service. This is harmless when the postgres profile
      # is NOT enabled (the BFF still falls back to json/sqlite based
      # on TS_PLATFORM_STATE_BACKEND), and it lets users opt-in to the
      # Postgres backend by setting TS_PLATFORM_STATE_BACKEND=postgres
      # in .env.docker without having to also hand-edit the URL.
      TS_PLATFORM_STATE_DATABASE_URL: "${TS_PLATFORM_STATE_DATABASE_URL:-postgres://ragent:ragent-dev@postgres:5432/ragent}"
    ports:
      - "${RAGENT_WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/session >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: ragent-qdrant
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "${RAGENT_QDRANT_HOST_PORT:-6333}:6333"
      - "${RAGENT_QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    container_name: ragent-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      # These match the connection string the web service defaults to.
      # Override here AND in TS_PLATFORM_STATE_DATABASE_URL (in
      # .env.docker) if you want different credentials.
      POSTGRES_USER: "${POSTGRES_USER:-ragent}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ragent-dev}"
      POSTGRES_DB: "${POSTGRES_DB:-ragent}"
    ports:
      - "${RAGENT_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ragent} -d $${POSTGRES_DB:-ragent}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6

volumes:
  python_data:
    name: ragent_python_data
  qdrant_data:
    name: ragent_qdrant_data
  postgres_data:
    name: ragent_postgres_data
