# One-command demo stack for Ragent.
#
#   docker compose up                          # web + python-api (no vector store)
#   docker compose --profile qdrant up         # also start Qdrant + flip retrieval backend
#
# Host ports default to 3000 (web), 8000 (python-api), and
# 6333/6334 (qdrant, only with the profile enabled).
#
# Configuration is read from `.env.docker` in this directory (which is
# gitignored). Start by copying `.env.docker.example` to `.env.docker`
# and editing it. The compose file injects a few service-to-service
# values (e.g. PYTHON_API_BASE_URL pointing at the python-api service
# hostname on the compose bridge network) that you should NOT have to
# touch.

name: ragent

services:
  python-api:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: ragent-python-api:dev
    container_name: ragent-python-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Service-to-service overrides. These are intentionally set here
      # (not in .env.docker) so the demo "just works" out of the box.
      PYTHON_HOST: "0.0.0.0"
      PYTHON_PORT: "8000"
      # Persist the sqlite-backed ingestion store inside the named
      # volume so restarts do not lose state.
      PYTHON_INGESTION_SQLITE_PATH: "/home/app/data/ingestion.db"
      # Point at the qdrant service if it's running. Has no effect when
      # PYTHON_RETRIEVAL_BACKEND is not "qdrant" / "hybrid", which is
      # the default for the no-profile launch.
      PYTHON_QDRANT_URL: "http://qdrant:6333"
    ports:
      - "${RAGENT_PYTHON_HOST_PORT:-8000}:8000"
    volumes:
      - python_data:/home/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ragent-web:dev
    container_name: ragent-web
    restart: unless-stopped
    depends_on:
      python-api:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Pin the BFF to the Python pipeline so the demo exercises the
      # full Python stack out of the box. Override in .env.docker if
      # you want the TS-only fallback path.
      RAG_BACKEND: "python"
      # Service-to-service: web → python-api over the compose bridge.
      PYTHON_API_BASE_URL: "http://python-api:8000"
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${RAGENT_WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/session >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: ragent-qdrant
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "${RAGENT_QDRANT_HOST_PORT:-6333}:6333"
      - "${RAGENT_QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  python_data:
    name: ragent_python_data
  qdrant_data:
    name: ragent_qdrant_data
