[project]
name = "ragent-python"
version = "0.1.0"
description = "Python backend for the Ragent migration project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=1.50,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]
llm-openai = []
llm-anthropic = []
llm-ollama = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship non-.py data files that the runtime loads at request time
# (e.g. the ecommerce module's static product catalog) inside the
# installed wheel. Without this declaration setuptools strips them
# and the Docker image fails at runtime with FileNotFoundError.
"ragent_python" = ["**/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
